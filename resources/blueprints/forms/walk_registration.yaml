title: 'Scalby Walk Registration'
tabs:
  main:
    display: Registration
    sections:
      -
        display: Registrant
        fields:
          -
            handle: booking_year
            field:
              type: integer
              display: 'Booking year'
          -
            handle: first_name
            field:
              type: text
              display: 'First name'
          -
            handle: last_name
            field:
              type: text
              display: 'Last name'
          -
            handle: email
            field:
              type: text
              input_type: email
              display: 'Email address'
          -
            handle: phone
            field:
              type: text
              display: 'Phone number'
          -
            handle: address_line_1
            field:
              type: text
              display: 'Address line 1'
          -
            handle: address_line_2
            field:
              type: text
              display: 'Address line 2'
          -
            handle: town
            field:
              type: text
              display: 'Town or city'
          -
            handle: postcode
            field:
              type: text
              display: Postcode
          -
            handle: country
            field:
              type: text
              display: Country
      -
        display: Walkers
        fields:
          -
            handle: adult_count
            field:
              type: integer
              display: 'Adult walkers'
          -
            handle: adult_walkers_summary
            field:
              type: textarea
              display: 'Adult walker details'
          -
            handle: junior_count
            field:
              type: integer
              display: 'Junior walkers'
          -
            handle: junior_walkers_summary
            field:
              type: textarea
              display: 'Junior walker details'
          -
            handle: adult_walkers
            field:
              type: hidden
          -
            handle: junior_walkers
            field:
              type: hidden
      -
        display: Order
        fields:
          -
            handle: donation
            field:
              type: text
              display: Donation
          -
            handle: total
            field:
              type: text
              display: 'Total paid'
          -
            handle: donation_pence
            field:
              type: hidden
          -
            handle: line_items
            field:
              type: hidden
          -
            handle: total_pence
            field:
              type: hidden
          -
            handle: walker_details_confirmation
            field:
              type: toggle
              display: 'Walker details confirmed'
          -
            handle: rules_confirmation
            field:
              type: toggle
              display: 'Rules confirmed'
          -
            handle: privacy_consent
            field:
              type: toggle
              display: 'Privacy consent'
  payment:
    display: Payment
    sections:
      -
        fields:
          -
            handle: payment_status
            field:
              type: select
              display: 'Payment status'
              options:
                creating_checkout: 'Creating checkout'
                awaiting_payment: 'Awaiting payment'
                paid: Paid
                expired: Expired
                checkout_error: 'Checkout error'
          -
            handle: stripe_checkout_session_id
            field:
              type: text
              display: 'Stripe Checkout Session'
          -
            handle: stripe_payment_intent_id
            field:
              type: text
              display: 'Stripe Payment Intent'
          -
            handle: paid_at
            field:
              type: text
              display: 'Paid at'
          -
            handle: confirmation_sent_at
            field:
              type: text
              display: 'Confirmation sent at'
          -
            handle: recipient_emails
            field:
              type: hidden
