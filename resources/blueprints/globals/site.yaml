title: Site Settings
tabs:
  contact:
    display: Contact & links
    sections:
      -
        display: Contact details
        fields:
          -
            handle: contact_email
            field:
              type: text
              input_type: email
              display: Public email address
          -
            handle: contact_phone
            field:
              type: text
              input_type: tel
              display: Public phone number
          -
            handle: postal_address
            field:
              type: textarea
              display: Postal address
          -
            handle: social_links
            field:
              type: grid
              display: Social links
              add_row: Add social link
              fields:
                -
                  handle: label
                  field:
                    type: text
                    display: Name
                    validate:
                      - required
                -
                  handle: url
                  field:
                    type: link
                    display: Link
                    validate:
                      - required
  actions:
    display: Actions
    sections:
      -
        display: External services
        fields:
          -
            handle: donation_url
            field:
              type: link
              display: Donation link
          -
            handle: newsletter_url
            field:
              type: link
              display: Newsletter sign-up link
          -
            handle: default_stall_booking_url
            field:
              type: link
              display: Default stall booking link
          -
            handle: default_walk_booking_url
            field:
              type: link
              display: Default walk booking link
      -
        display: Emergency notice
        fields:
          -
            handle: emergency_notice
            field:
              type: textarea
              display: Notice text
              instructions: Optional urgent, site-wide message. Remove the text to hide the notice.
          -
            handle: emergency_notice_link
            field:
              type: link
              display: Notice link
              if:
                emergency_notice: 'not null'
          -
            handle: emergency_notice_label
            field:
              type: text
              display: Notice link label
              if:
                emergency_notice: 'not null'
  stall_bookings:
    display: Stall bookings
    sections:
      -
        display: Availability and notifications
        fields:
          -
            handle: stall_bookings_open
            field:
              type: toggle
              display: 'Accept online stall bookings'
              instructions: 'Switch this off to close the whole booking form without removing the page.'
              default: false
          -
            handle: stall_booking_year
            field:
              type: integer
              display: 'Booking year'
              validate:
                - required
                - integer
          -
            handle: stall_booking_recipient_email
            field:
              type: text
              input_type: email
              display: 'Send paid bookings to'
              instructions: 'A full confirmation is sent here only after Stripe confirms payment.'
              validate:
                - required
                - email
      -
        display: Items and prices
        instructions: 'Change prices here each year. Switch an item off to show it as unavailable and prevent it being purchased.'
        fields:
          -
            handle: stall_booking_items
            field:
              type: grid
              display: 'Bookable items'
              add_row: 'Add item'
              reorderable: true
              fields:
                -
                  handle: code
                  field:
                    type: slug
                    display: 'Item code'
                    instructions: 'A short unique code. Avoid changing this once bookings have opened.'
                    validate:
                      - required
                -
                  handle: name
                  field:
                    type: text
                    display: Name
                    validate:
                      - required
                -
                  handle: description
                  field:
                    type: textarea
                    display: Description
                -
                  handle: price
                  field:
                    type: float
                    display: Price
                    prepend: £
                    min: 0.01
                    step: 0.01
                    validate:
                      - required
                      - numeric
                -
                  handle: max_quantity
                  field:
                    type: integer
                    display: 'Maximum per booking'
                    default: 5
                    min: 1
                    max: 20
                    validate:
                      - required
                      - integer
                -
                  handle: available
                  field:
                    type: toggle
                    display: 'On sale'
                    default: true
  walk_bookings:
    display: Walk bookings
    sections:
      -
        display: Availability and notifications
        fields:
          -
            handle: walk_registrations_open
            field:
              type: toggle
              display: 'Accept online Walk registrations'
              instructions: 'Switch this off to close the whole registration form without removing the page.'
              default: false
          -
            handle: walk_booking_year
            field:
              type: integer
              display: 'Booking year'
              validate:
                - required
                - integer
          -
            handle: walk_booking_recipients
            field:
              type: grid
              display: 'Send paid registrations to'
              instructions: 'Each address receives a blind copy of the confirmation sent to the registrant after Stripe confirms payment.'
              add_row: 'Add recipient'
              fields:
                -
                  handle: name
                  field:
                    type: text
                    display: Name
                    validate:
                      - required
                -
                  handle: email
                  field:
                    type: text
                    input_type: email
                    display: 'Email address'
                    validate:
                      - required
                      - email
      -
        display: Prices and availability
        instructions: 'Change prices here each year. Switch a booking type off to prevent it being purchased while leaving the rest of the form open.'
        fields:
          -
            handle: walk_adult_price
            field:
              type: float
              display: 'Adult walker price'
              prepend: £
              min: 0.01
              step: 0.01
              validate:
                - required
                - numeric
          -
            handle: walk_adult_bookings_available
            field:
              type: toggle
              display: 'Adult bookings on sale'
              default: true
          -
            handle: walk_junior_price
            field:
              type: float
              display: 'Junior walker price'
              prepend: £
              min: 0.01
              step: 0.01
              validate:
                - required
                - numeric
          -
            handle: walk_junior_bookings_available
            field:
              type: toggle
              display: 'Junior bookings on sale'
              default: true
          -
            handle: walk_donations_enabled
            field:
              type: toggle
              display: 'Accept an optional charity donation'
              default: true
  impact:
    display: Impact
    sections:
      -
        fields:
          -
            handle: statistics
            field:
              type: grid
              display: Homepage statistics
              instructions: Keep to four or five short, verifiable facts.
              min_rows: 1
              max_rows: 5
              add_row: Add statistic
              fields:
                -
                  handle: value
                  field:
                    type: text
                    display: Figure
                    validate:
                      - required
                -
                  handle: label
                  field:
                    type: text
                    display: Meaning
                    validate:
                      - required
  footer:
    display: Footer
    sections:
      -
        fields:
          -
            handle: organisation_name
            field:
              type: text
              display: Organisation name
              required: true
              validate:
                - required
          -
            handle: footer_text
            field:
              type: textarea
              display: Footer introduction
          -
            handle: charity_details
            field:
              type: text
              display: Charity or organisation details
              instructions: Optional. Only add verified registration wording.
          -
            handle: askew_brook_credit
            field:
              type: link
              display: Askew Brook credit link
      -
        display: Askew Brook banner
        instructions: This full-width acknowledgement appears immediately above the footer on every page.
        fields:
          -
            handle: askew_brook_banner_enabled
            field:
              type: toggle
              display: Show banner
              default: true
          -
            handle: askew_brook_logo
            field:
              type: assets
              display: Askew Brook logo
              container: assets
              max_files: 1
              mode: list
              if:
                askew_brook_banner_enabled: 'equals true'
          -
            handle: askew_brook_heading
            field:
              type: text
              display: Heading
              if:
                askew_brook_banner_enabled: 'equals true'
          -
            handle: askew_brook_text
            field:
              type: textarea
              display: Supporting text
              if:
                askew_brook_banner_enabled: 'equals true'
          -
            handle: askew_brook_label
            field:
              type: text
              display: Button label
              if:
                askew_brook_banner_enabled: 'equals true'
          -
            handle: askew_brook_url
            field:
              type: link
              display: Button link
              if:
                askew_brook_banner_enabled: 'equals true'
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            handle: site_name
            field:
              type: text
              display: Site name
              required: true
              validate:
                - required
          -
            handle: default_seo_title
            field:
              type: text
              display: Default SEO title
              character_limit: 60
          -
            handle: default_seo_description
            field:
              type: textarea
              display: Default SEO description
              character_limit: 160
          -
            handle: default_share_image
            field:
              type: assets
              display: Default social sharing image
              container: assets
              max_files: 1
              mode: list
              folder: social
