title: Homepage
tabs:
  main:
    display: Homepage
    sections:
      -
        display: Hero
        fields:
          -
            handle: title
            field:
              type: text
              display: Page title
              required: true
              validate:
                - required
          -
            handle: hero_kicker
            field:
              type: text
              display: Hero label
          -
            handle: hero_heading
            field:
              type: text
              display: Hero heading
              required: true
              validate:
                - required
          -
            handle: hero_text
            field:
              type: textarea
              display: Hero text
          -
            handle: hero_image
            field:
              type: assets
              display: Hero image
              container: assets
              max_files: 1
              mode: list
              folder: homepage
          -
            handle: hero_supporting_images
            field:
              type: assets
              display: Supporting hero images
              instructions: Choose two or three candid photographs to accompany the introduction.
              container: assets
              max_files: 3
              mode: list
              folder: homepage
          -
            handle: hero_link_label
            field:
              type: text
              display: Primary button label
          -
            handle: hero_link
            field:
              type: link
              display: Primary button link
      -
        display: Introduction
        fields:
          -
            handle: introduction_heading
            field:
              type: text
              display: Heading
          -
            handle: introduction
            field:
              type: markdown
              display: Introduction
              buttons:
                - bold
                - italic
                - link
      -
        display: Highlights
        fields:
          -
            handle: programme_images
            field:
              type: assets
              display: Programme preview images
              instructions: Shown while the next programme is being prepared.
              container: assets
              max_files: 3
              mode: list
              folder: homepage
          -
            handle: fair_week_summary
            field:
              type: textarea
              display: Fair Week summary
          -
            handle: fair_week_image
            field:
              type: assets
              display: Fair Week image
              container: assets
              max_files: 1
              mode: list
              folder: homepage
          -
            handle: fair_day_summary
            field:
              type: textarea
              display: Fair Day summary
          -
            handle: fair_day_image
            field:
              type: assets
              display: Fair Day image
              container: assets
              max_files: 1
              mode: list
              folder: homepage
          -
            handle: walk_summary
            field:
              type: textarea
              display: Scalby Walk summary
          -
            handle: walk_image
            field:
              type: assets
              display: Scalby Walk image
              container: assets
              max_files: 1
              mode: list
              folder: homepage
          -
            handle: archive_heading
            field:
              type: text
              display: Off-season heading
              instructions: Shown when there are no upcoming events.
          -
            handle: archive_text
            field:
              type: textarea
              display: Off-season text
      -
        display: Community stories
        fields:
          -
            handle: impact_background_image
            field:
              type: assets
              display: Impact background image
              container: assets
              max_files: 1
              mode: list
              folder: homepage
          -
            handle: news_empty_image
            field:
              type: assets
              display: News preview image
              instructions: Shown before the first news story is published.
              container: assets
              max_files: 1
              mode: list
              folder: homepage
          -
            handle: community_heading
            field:
              type: text
              display: Community gallery heading
          -
            handle: community_text
            field:
              type: textarea
              display: Community gallery text
          -
            handle: community_gallery
            field:
              type: assets
              display: Community gallery
              instructions: Select four to six photographs with a mixture of people, performances and activities.
              container: assets
              max_files: 6
              mode: list
              folder: homepage
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            import: seo
  sidebar:
    display: Settings
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
          -
            handle: template
            field:
              type: hidden
              default: home
