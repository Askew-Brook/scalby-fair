title: Page
tabs:
  main:
    display: Content
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              display: Title
              validate:
                - required
          -
            handle: eyebrow
            field:
              type: text
              display: Eyebrow
              instructions: 'Optional short label above the page title.'
          -
            handle: introduction
            field:
              type: textarea
              display: Introduction
              instructions: 'One or two sentences that introduce this page.'
          -
            handle: featured_image
            field:
              type: assets
              display: 'Featured image'
              container: assets
              max_files: 1
              mode: list
          -
            handle: supporting_image
            field:
              type: assets
              display: 'Supporting image'
              instructions: 'Optional second photograph used as an editorial detail in the page header.'
              container: assets
              max_files: 1
              mode: list
          -
            handle: content
            field:
              type: markdown
              display: 'Page content'
              instructions: 'Use headings, short paragraphs and lists to keep the page easy to scan.'
              buttons:
                - h2
                - h3
                - bold
                - italic
                - unorderedlist
                - orderedlist
                - quote
                - link
                - image
          -
            handle: fair_week_highlights
            field:
              type: entries
              display: Fair Week highlights
              instructions: Choose up to three events in display order. Only published events in the displayed Fair Week programme appear. Leave blank to use the featured events.
              collections: [events]
              max_items: 3
              mode: select
              if:
                template: 'equals fair-week'
          -
            handle: callout_heading
            field:
              type: text
              display: 'Callout heading'
              instructions: 'Optional closing call to action.'
          -
            handle: callout_text
            field:
              type: textarea
              display: 'Callout text'
              if:
                callout_heading: 'not null'
          -
            handle: callout_link
            field:
              type: link
              display: 'Callout link'
              if:
                callout_heading: 'not null'
          -
            handle: callout_label
            field:
              type: text
              display: 'Callout button label'
              if:
                callout_heading: 'not null'
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            import: seo
  sidebar:
    display: Settings
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate:
                - required
          -
            handle: template
            field:
              type: template
              display: Template
              instructions: 'Only change this when the page has a dedicated layout.'
              default: page
