title: Article
tabs:
  main:
    display: Article
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              display: Headline
              required: true
              validate:
                - required
          -
            handle: summary
            field:
              type: textarea
              display: Summary
              character_limit: 220
              required: true
              validate:
                - required
          -
            handle: featured_image
            field:
              type: assets
              display: Featured image
              container: assets
              max_files: 1
              mode: list
          -
            handle: content
            field:
              type: article_body
              display: Article content
              instructions: 'Use headings to structure the article. The link tool lets you choose a site entry or enter a URL. Pasted text keeps supported formatting such as headings, lists, emphasis and links.'
              container: assets
              link_collections: [pages, news, events]
              enable_paste_rules: true
              required: true
              validate:
                - required
              buttons:
                - h2
                - h3
                - h4
                - bold
                - italic
                - unorderedlist
                - orderedlist
                - quote
                - anchor
                - image
                - removeformat
          -
            handle: news_categories
            field:
              type: terms
              display: Categories
              taxonomies:
                - news_categories
              mode: select
              create: true
          -
            handle: related_events
            field:
              type: entries
              display: Related events
              collections:
                - events
              mode: select
          -
            handle: gallery
            field:
              type: assets
              display: Gallery
              container: assets
              mode: grid
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            import: seo
  sidebar:
    display: Settings
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              validate:
                - required
          -
            handle: date
            field:
              type: date
              display: Publication date
              required: true
              validate:
                - required
